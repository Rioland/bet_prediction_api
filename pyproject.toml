[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "football-ai-predictor-api"
version = "0.1.0"
description = "FastAPI backend for Football AI Predictor"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.1",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "redis>=5.0.8",
  "celery>=5.4.0",
  "httpx>=0.27.0",
  "scikit-learn>=1.5.1",
  "xgboost>=2.1.1",
  "pandas>=2.2.2",
  "numpy>=2.0.1",
  "joblib>=1.4.2",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.9",
  "pyotp>=2.9.0",
  "cryptography>=43.0.1",
  "bcrypt>=4.2.0",
  "itsdangerous>=2.2.0",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
  dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.6.2",
  "bcrypt>=4.2.0",
  "itsdangerous>=2.2.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
